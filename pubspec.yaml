name: avatar_pos
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management (Cross-platform)
  flutter_riverpod: ^2.5.1

  # Routing (Cross-platform)
  go_router: ^14.2.7

  # Local Storage (Cross-platform - uses IndexedDB on web, native on others)
  shared_preferences: ^2.2.3

  # Utilities (Cross-platform)
  intl: ^0.19.0
  uuid: ^4.5.1

  # JSON Serialization (Cross-platform)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Supabase (Cross-platform)
  supabase_flutter: ^2.5.6

  # Environment Variables
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - .env
